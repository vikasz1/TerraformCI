name: Deploy app service to Azure - Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: plan or apply'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  AZURE_RESOURCE_GROUP: terraform-app-rg-dev
  TERRAFORM_VERSION: 1.5.0

jobs:
  terraform-plan:
    # Run automatically on push, or when manually triggered
    runs-on: ubuntu-latest
    outputs:
      tfplan: ${{ steps.plan.outputs.tfplan }}
    # Skip plan if manually triggered with action=apply only
    if: github.event_name == 'push' || github.event.inputs.action != 'apply'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file=terraform.dev.tfvars -out=tfplan 2>&1 | tee plan-output.txt
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: tfplan

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: plan-output-dev
          path: plan-output.txt

      - name: Create Plan Summary Comment
        if: github.event_name == 'push' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan-output.txt', 'utf8');
            const summary = `## 📋 Terraform Plan (Dev) - Ready for Review\n\n**Status:** Plan generated successfully\n\n### To Apply These Changes:\n\n1. Go to **Actions** tab\n2. Select this workflow run\n3. Click **"terraform-apply"** job\n4. Click **"Run apply"** or re-run workflow with action=apply\n\n<details>\n<summary>Click to view plan details</summary>\n\n\`\`\`\n${planOutput}\n\`\`\`\n</details>\n\n⚠️ **Review the changes above carefully before applying!**`;
            console.log(summary);

  terraform-apply:
    runs-on: ubuntu-latest
    environment: development
    # Only run on manual workflow_dispatch with action=apply
    if: github.event_name == 'workflow_dispatch' || github.event.inputs.action == 'apply'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Output
        run: terraform output -no-color

  deploy-to-app-service:
    needs: terraform-apply
    if: success() && (github.event_name == 'workflow_dispatch' || github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: myapp-dev
          package: .
